name: Provision Infrastructure (Bicep)

# ⚠️ Yêu cầu trước khi chạy workflow này lần đầu: đã chạy `infra/bootstrap.sh` thủ công
# (1 lần, bởi người có quyền subscription) để tạo Resource Group và gán Contributor
# cho Service Principal (secrets.AZURE_CREDENTIALS) CHỈ trên đúng Resource Group đó.
# Workflow này KHÔNG tự tạo Resource Group, và SP dùng ở đây không cần quyền gì cao hơn
# Contributor-trên-1-RG.

on:
  workflow_dispatch:
    inputs:
      location:
        description: 'Azure region để triển khai'
        required: false
        default: 'eastasia'
  push:
    branches: [main]
    paths:
      - 'infra/**'

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # scope=resourcegroup: Resource Group ĐÃ tồn tại từ trước (tạo 1 lần bằng infra/bootstrap.sh
      # bởi người có quyền cao). Nhờ vậy SP dùng ở đây chỉ cần Contributor trên đúng RG này —
      # không cần Owner/Contributor ở subscription.
      - name: Deploy Bicep - tạo tài nguyên bên trong Resource Group có sẵn
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ vars.RESOURCE_GROUP || 'digital-twin-rg' }}
          template: infra/main.bicep
          deploymentName: mlops-infra-${{ github.run_number }}
          parameters: >
            location=${{ github.event.inputs.location || 'eastasia' }}
            workspaceName=${{ vars.WORKSPACE || 'mlops-workspace' }}
            keyVaultName=${{ vars.KEY_VAULT_NAME || 'qwen-twin-vault' }}
      # Không truyền acrName: Bicep tự sinh tên duy nhất (deterministic) — xem infra/main.bicep.
      # deploy.yml sẽ tự tìm ra ACR này bằng `az acr list -g <resource_group>`, không hard-code ở đâu cả.

      - name: In kết quả triển khai
        run: |
          echo "Hạ tầng đã được tạo. deploy.yml sẽ tự tìm ra ACR bằng 'az acr list', không cần copy tay giá trị nào."
