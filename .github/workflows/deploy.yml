name: MLOps Pipeline - Qwen RAG Digital Twin

on:
  push:
    tags:
      - 'v*.*.*' # Chỉ chạy khi có git tag dạng v1.0.0

env:
  WORKSPACE: ${{ vars.WORKSPACE || 'mlops-workspace' }}         # Cùng nguồn với infra.yml (GitHub repo Variable)
  RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP || 'digital-twin-rg' }} # Cùng nguồn với infra.yml (GitHub repo Variable)
  IMAGE_NAME: "qwen-rag-api"                          # Khớp với azure/deployment.yml
  ENDPOINT_NAME: "qwen-rag-endpoint-ver1"              # Khớp với azure/endpoint.yml
  DEPLOYMENT_NAME: "rag-deployment-ver1"               # Khớp với azure/deployment.yml
  IMAGE_TAG: "v1.${{ github.run_number }}"            # Tag image linh hoạt theo từng lần chạy

jobs:
  # Luôn chạy infra.yml TRƯỚC, như một job trong chính workflow run này (không phải
  # một workflow run riêng biệt) — nhờ vậy GitHub Actions tự đảm bảo thứ tự,
  # thay vì để 2 workflow độc lập chạy song song khi cùng bị trigger bởi 1 lần push.
  ensure-infra:
    uses: ./.github/workflows/infra.yml
    secrets: inherit

  build-register-deploy:
    needs: ensure-infra
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install Azure ML Extension
        run: az extension add -n ml -y

      - name: Set Default Azure ML Workspace
        run: |
          az configure --defaults workspace=${{ env.WORKSPACE }} group=${{ env.RESOURCE_GROUP }}

      # ACR là tài nguyên do infra.yml (Bicep) tạo ra với tên tự sinh — không hard-code ở đây.
      # Tự tìm ACR duy nhất đang có trong Resource Group để đảm bảo deploy.yml luôn khớp với hạ tầng hiện tại.
      - name: Discover ACR in Resource Group
        run: |
          ACR_NAME=$(az acr list -g ${{ env.RESOURCE_GROUP }} --query "[0].name" -o tsv)
          if [ -z "$ACR_NAME" ]; then
            echo "::error::Không tìm thấy ACR nào trong Resource Group ${{ env.RESOURCE_GROUP }}. Đã chạy workflow infra.yml (Bicep) chưa?"
            exit 1
          fi
          echo "Tìm thấy ACR: $ACR_NAME"
          echo "ACR_NAME=$ACR_NAME" >> "$GITHUB_ENV"

      # BYOM: model .gguf đã được huấn luyện, đóng băng và đăng ký sẵn trong Azure ML Models
      # (azure/model.yml chỉ còn dùng để đối chiếu tên/version khi kiểm tra idempotent bên dưới).
      # Container lấy model trực tiếp qua AZUREML_MODEL_DIR khi Azure ML mount deployment — không cần tải gì ở đây.

      - name: Login to Azure Container Registry (ACR)
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Docker Build & Push Image
        run: |
          IMAGE_URI="${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          echo "Target Image URI: $IMAGE_URI"

          # Cập nhật azure/deployment.yml để luôn trỏ đúng image vừa build
          sed -i "s|image: .*|image: $IMAGE_URI|g" azure/deployment.yml

          TAG_EXISTS=$(az acr repository show-tags -n ${{ env.ACR_NAME }} --repository ${{ env.IMAGE_NAME }} --query "[?@=='${{ env.IMAGE_TAG }}']" -o tsv 2>/dev/null || true)

          if [ -n "$TAG_EXISTS" ]; then
            echo "Image tag ${{ env.IMAGE_TAG }} đã tồn tại trên ACR. BỎ QUA build/push."
          else
            echo "Building & pushing Docker image (context = repo root, theo Dockerfile hiện có)..."
            docker build -t "$IMAGE_URI" .
            docker push "$IMAGE_URI"
          fi

      - name: Register Profile Data Asset (idempotent)
        run: |
          DATA_NAME=$(grep '^name:' azure/profile_data.yml | awk '{print $2}')
          DATA_VERSION=$(grep '^version:' azure/profile_data.yml | awk '{print $2}')

          if az ml data show --name "$DATA_NAME" --version "$DATA_VERSION" > /dev/null 2>&1; then
            echo "Data asset $DATA_NAME v$DATA_VERSION đã tồn tại. BỎ QUA."
          else
            az ml data create -f azure/profile_data.yml
          fi

      - name: Register Knowledge Base Vector DB Asset
        run: az ml data create -f azure/knowledge_db.yml

      - name: Register Qwen GGUF Model
        run: |
          MODEL_NAME=$(grep '^name:' azure/model.yml | awk '{print $2}')
          MODEL_VERSION=$(grep '^version:' azure/model.yml | awk '{print $2}')

          if [ -z "$MODEL_VERSION" ]; then
            echo "Không có version cụ thể trong YAML. Đăng ký với auto-increment..."
            az ml model create -f azure/model.yml
            exit 0
          fi

          if az ml model show --name "$MODEL_NAME" --version "$MODEL_VERSION" > /dev/null 2>&1; then
            echo "Model $MODEL_NAME v$MODEL_VERSION đã tồn tại. BỎ QUA đăng ký."
          else
            echo "Đăng ký model mới..."
            az ml model create -f azure/model.yml
          fi

      - name: Create or Update Online Endpoint
        run: |
          echo "Cấu hình online endpoint: ${{ env.ENDPOINT_NAME }}"
          # 'create' của Azure CLI v2 tự động cập nhật nếu endpoint đã tồn tại
          az ml online-endpoint create -n ${{ env.ENDPOINT_NAME }} -f azure/endpoint.yml

      - name: Create or Update Online Deployment (Idempotent Logic)
        run: |
          echo "Kiểm tra trạng thái deployment: ${{ env.DEPLOYMENT_NAME }}..."

          if az ml online-deployment show -n ${{ env.DEPLOYMENT_NAME }} -e ${{ env.ENDPOINT_NAME }} > /dev/null 2>&1; then
            echo "Deployment đã tồn tại. Tiến hành UPDATE..."
            az ml online-deployment update -n ${{ env.DEPLOYMENT_NAME }} -e ${{ env.ENDPOINT_NAME }} -f azure/deployment.yml
          else
            echo "Deployment chưa tồn tại. Tiến hành CREATE..."
            az ml online-deployment create -n ${{ env.DEPLOYMENT_NAME }} -e ${{ env.ENDPOINT_NAME }} -f azure/deployment.yml
          fi

      - name: Route Traffic to Deployment
        run: |
          echo "Chuyển 100% traffic sang ${{ env.DEPLOYMENT_NAME }}..."
          az ml online-endpoint update -n ${{ env.ENDPOINT_NAME }} --traffic "${{ env.DEPLOYMENT_NAME }}=100"

      - name: Smoke Test Endpoint
        run: |
          SCORING_URI=$(az ml online-endpoint show -n ${{ env.ENDPOINT_NAME }} --query scoring_uri -o tsv)
          KEY=$(az ml online-endpoint get-credentials -n ${{ env.ENDPOINT_NAME }} --query primaryKey -o tsv)

          echo "Gửi request kiểm tra tới $SCORING_URI ..."
          curl -sf -X POST "$SCORING_URI" \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            -d '{"messages":[{"role":"user","content":"Xin chào"}], "max_tokens": 32}' \
            || { echo "::error::Smoke test thất bại sau khi deploy."; exit 1; }