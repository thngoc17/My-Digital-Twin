$schema: https://azuremlschemas.azureedge.net/latest/managedOnlineDeployment.schema.json
name: rag-deployment-ver1
endpoint_name: qwen-rag-endpoint-ver1

# Chỉ định mô hình đã đăng ký ở Ngày 3. Azure sẽ tải và mount nó vào AZUREML_MODEL_DIR
model: azureml:qwen3-4b-gguf-model:1

environment:
  # ⚠️ Giá trị dưới đây chỉ là placeholder. Nó luôn bị ghi đè tự động bởi bước
  # "Docker Build & Push Image" trong .github/workflows/deploy.yml (lệnh sed),
  # vì tên ACR thật do infra.yml (Bicep) tạo mới mỗi lần và không cố định.
  # Không cần và không nên sửa tay giá trị này.
  image: PLACEHOLDER-ACR.azurecr.io/qwen-rag-api:v1
  inference_config:
    liveness_route:
      port: 8000
      path: /docs
    readiness_route:
      port: 8000
      path: /docs
    scoring_route:
      port: 8000
      path: /chat

request_settings:
  request_timeout_ms: 180000

# Cấu hình tài nguyên máy ảo
instance_type: Standard_DS2_v2
instance_count: 1